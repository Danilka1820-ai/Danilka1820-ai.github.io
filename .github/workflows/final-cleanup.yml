name: One-time final cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/final-cleanup-once.py'
      - '.github/workflows/final-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-final-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Применить финальную уборку
        run: python scripts/final-cleanup-once.py

      - name: Проверить сайт
        run: node scripts/check-site.mjs

      - name: Проверить весь JS/MJS
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find . -type f \( -name '*.js' -o -name '*.mjs' \) \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              -print0
          )

      - name: Проверить diff
        run: git diff --check

      - name: Сохранить финальную уборку
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish site cleanup and accessibility pass"
          pushed=false
          for delay in 0 2 4 8 16; do
            sleep "$delay"
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=true
              break
            fi
          done
          test "$pushed" = "true"
