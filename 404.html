<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1A1410">
<meta name="description" content="Страница не найдена — дневник Данила Сарыкова.">
<meta name="robots" content="noindex, follow">
<title>404 — Страница не найдена</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231A1410'/><circle cx='32' cy='32' r='12' fill='%23C8553D'/></svg>">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1410;
  --terracotta:#C8553D;
  --cream:#F4EEE6;
  --soft:#544A43;
  --line:rgba(26,20,16,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  background:var(--cream);
  color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,sans-serif;
}
.code{
  font-family:"Instrument Serif",serif;
  font-style:italic;
  font-size:clamp(4rem,16vw,8rem);
  color:var(--terracotta);
  line-height:1;
}
h1{
  margin-top:16px;
  font-family:"Instrument Serif",serif;
  font-weight:400;
  font-size:clamp(1.4rem,3.5vw,2rem);
}
p{
  margin-top:12px;
  color:var(--soft);
  max-width:380px;
}
a.btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-top:32px;
  padding:14px 30px;
  border-radius:100px;
  background:var(--ink);
  color:var(--cream);
  text-decoration:none;
  font-weight:600;
  font-size:14px;
  letter-spacing:.03em;
  transition:background .25s ease,transform .25s ease;
}
a.btn:hover{background:var(--terracotta);transform:translateY(-2px)}
</style>
</head>
<body>
  <span class="code">404</span>
  <h1>Такой страницы дневника нет</h1>
  <p>Похоже, эта запись не существует или переехала. Вернись на главную страницу.</p>
  <a href="/" class="btn">На главную →</a>
</body>
</html>
