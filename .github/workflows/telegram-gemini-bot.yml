name: Telegram Grok bot

# GitHub Actions не умеет держать процесс запущенным постоянно, поэтому
# вместо одного вечно висящего бота каждый запуск (~7 минут прослушки)
# в конце сам запускает свою следующую копию через GitHub API —
# см. telegram-gemini-bot/poll_once.py -> trigger_next_run(). Получается
# почти непрерывная работа без своего сервера. Расписание ниже — не
# основной механизм, а подстраховка на случай, если цепочка самозапусков
# где-то оборвётся (например, упавший запуск не успел запустить следующий).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

# Боту не нужно ничего коммитить в репозиторий — только читать секреты,
# ходить в Telegram/xAI API и запускать сам себя дальше (actions: write
# нужен именно для самозапуска через API, contents: write не нужен).
permissions:
  contents: read
  actions: write

# Не даём двум запускам опрашивать Telegram одновременно. Самозапущенная
# следующая копия ждёт завершения текущей, поэтому успешный запуск больше не
# получает ложный conclusion: cancelled на самой последней секунде.
concurrency:
  group: telegram-gemini-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Пять минут опроса + до двух минут обработки видео/голоса + установка
    # зависимостей. Восемь минут оставляли слишком маленький запас раннеру.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: telegram-gemini-bot/requirements.txt

      - name: Установить зависимости
        working-directory: telegram-gemini-bot
        run: pip install -r requirements.txt

      # Только для обычного видео: несколько кадров через ffmpeg, раз у Grok
      # нет API, понимающего видео целиком (см. extract_video_frames в bot.py).
      # Кружочки и голосовые в нём не нуждаются — уходят в Speech-to-Text как есть.
      - name: Установить ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Опросить Telegram и обработать сообщения
        working-directory: telegram-gemini-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLL_SECONDS: "300"
          GROK_FILE_TIMEOUT_SECONDS: "120"
        run: python poll_once.py
