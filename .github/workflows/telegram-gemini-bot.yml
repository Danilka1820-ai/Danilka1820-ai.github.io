name: Telegram Bot API → сайт

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'telegram-gemini-bot/bot_api_cycle.py'
      - 'telegram-gemini-bot/bot.py'
      - 'telegram-gemini-bot/gemini_resilience.py'
      - 'telegram-gemini-bot/bot_utils.py'
      - 'telegram-gemini-bot/requirements.txt'
      - '.github/workflows/telegram-gemini-bot.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: telegram-site-publish
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: telegram-gemini-bot/requirements.txt

      - name: Установить ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Установить зависимости бота
        run: python -m pip install --disable-pip-version-check -r telegram-gemini-bot/requirements.txt

      - name: Забрать одну подтверждаемую пачку Bot API
        working-directory: telegram-gemini-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          TG_CHANNEL_USERNAME: danilka2028k
          GEMINI_FILE_TIMEOUT_SECONDS: '120'
          GEMINI_PRIMARY_MODEL: ${{ vars.GEMINI_PRIMARY_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          GEMINI_REQUEST_TIMEOUT: ${{ vars.GEMINI_REQUEST_TIMEOUT }}
          GEMINI_MAX_RETRIES: ${{ vars.GEMINI_MAX_RETRIES }}
        run: python bot_api_cycle.py

      - name: Собрать постоянные страницы записей
        run: node scripts/generate-post-pages.mjs

      - name: Проверить данные и медиа до публикации
        run: node scripts/check-site.mjs

      - name: Опубликовать изменения ленты
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/posts dnevnik sitemap.xml

          if git diff --cached --quiet; then
            echo "Лента не изменилась."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Sync diary from Telegram Bot API"
          pushed=false

          for delay in 0 2 4 8 16; do
            sleep "$delay"
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
          done

          if [ "$pushed" != "true" ]; then
            echo "Не удалось отправить обновление ленты после повторов." >&2
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Запросить публикацию GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
