<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Страница не найдена — Данила Сарников.">
<title>404 — Страница не найдена</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f172a'/><text x='32' y='42' font-family='sans-serif' font-size='30' font-weight='700' fill='%233b82f6' text-anchor='middle'>D</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.not-found {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}

.not-found .code {
  font-size: clamp(4rem, 14vw, 8rem);
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
}

.not-found h1 {
  margin-top: 16px;
  font-size: clamp(1.3rem, 3vw, 1.8rem);
  font-weight: 700;
}

.not-found p {
  margin-top: 12px;
  color: var(--text-muted);
  max-width: 420px;
}

.not-found .btn {
  margin-top: 32px;
}
</style>
</head>
<body>
<main class="not-found">
  <span class="code">404</span>
  <h1>Страница не найдена</h1>
  <p>Похоже, такой страницы не существует или она была перемещена.</p>
  <a href="/" class="btn btn-primary">На главную</a>
</main>
</body>
</html>
