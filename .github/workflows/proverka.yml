name: Проверка сайта

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proverka:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Проверить сайт
        run: node scripts/check-site.mjs

      - name: Проверить синтаксис всех JS/MJS
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Проверяю: $file"
            node --check "$file"
          done < <(
            find . -type f \( -name '*.js' -o -name '*.mjs' \) \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              -print0
          )

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: telegram-gemini-bot/requirements.txt

      - name: Установить зависимости проверки
        run: |
          python -m pip install --disable-pip-version-check -r telegram-gemini-bot/requirements.txt
          python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Проверить синтаксис Python
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in Path('telegram-gemini-bot').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              print(f'Синтаксис корректен: {path}')
          PY

      - name: Запустить тесты Telegram-бота
        run: python -m unittest discover -s telegram-gemini-bot -p 'test_*.py'

      - name: Проверить Python-зависимости на известные уязвимости
        run: python -m pip_audit -r telegram-gemini-bot/requirements.txt
