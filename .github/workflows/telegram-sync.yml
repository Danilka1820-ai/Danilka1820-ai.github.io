name: Telegram → сайт

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-telegram-posts.mjs'
      - '.github/workflows/telegram-sync.yml'

concurrency:
  group: telegram-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Без ffmpeg видео уезжает на сайт в том виде, в каком его отдал Telegram:
      # индекс в конце файла и битрейт для полного экрана. На раннере его нет.
      - name: Установить ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Plyr по умолчанию дёргает пустой ролик со своего сервера cdn.plyr.io.
      # Внешние запросы нам не нужны — делаем такой файл сами, один раз.
      - name: Заглушка для плеера
        run: |
          f=assets/vendor/plyr/blank.mp4
          if [ ! -s "$f" ]; then
            ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=32x32:d=0.1 \
              -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$f"
            echo "создан $f ($(stat -c%s "$f") байт)"
          fi

      - run: node scripts/fetch-telegram-posts.mjs
        env:
          TG_CHANNEL: danilka2028k

      - name: Commit new posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/posts assets/vendor
          if git diff --cached --quiet; then
            echo "Нет новых записей."
            exit 0
          fi
          git commit -m "Sync diary posts from Telegram"
          for delay in 0 2 4 8 16; do
            sleep $delay
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
          done
          exit 1
