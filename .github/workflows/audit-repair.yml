name: One-time audit repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-repair-once.mjs'
      - '.github/workflows/audit-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-audit-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Применить исправления аудита
        run: node scripts/audit-repair-once.mjs
      - name: Проверить diff
        run: git diff --check
      - name: Сохранить исправления
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет."
            exit 0
          fi
          git commit -m "Repair site after full audit"
          for delay in 0 2 4 8 16; do
            sleep "$delay"
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
