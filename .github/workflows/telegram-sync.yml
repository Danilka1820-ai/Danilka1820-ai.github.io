name: Telegram резервная сверка

on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/fetch-telegram-posts.mjs'
      - 'scripts/generate-post-pages.mjs'
      - '.github/workflows/telegram-sync.yml'

concurrency:
  group: telegram-site-publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Установить ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Аварийно сверить публичный канал
        run: node scripts/fetch-telegram-posts.mjs
        env:
          TG_CHANNEL: danilka2028k

      - name: Собрать постоянные страницы записей
        run: node scripts/generate-post-pages.mjs

      - name: Проверить данные и медиа до публикации
        run: node scripts/check-site.mjs

      - name: Опубликовать найденные расхождения
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/posts dnevnik sitemap.xml

          if git diff --cached --quiet; then
            echo "Расхождений нет."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Reconcile diary with Telegram public channel"
          pushed=false

          for delay in 0 2 4 8 16; do
            sleep "$delay"
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
          done

          if [ "$pushed" != "true" ]; then
            echo "Не удалось отправить резервную сверку после повторов." >&2
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Запросить публикацию GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
