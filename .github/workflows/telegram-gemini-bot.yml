name: Telegram Gemini bot

# GitHub Actions не умеет держать процесс запущенным постоянно, поэтому
# вместо одного вечно висящего бота каждый запуск (~7 минут прослушки)
# в конце сам запускает свою следующую копию через GitHub API —
# см. telegram-gemini-bot/poll_once.py -> trigger_next_run(). Получается
# почти непрерывная работа без своего сервера. Расписание ниже — не
# основной механизм, а подстраховка на случай, если цепочка самозапусков
# где-то оборвётся (например, упавший запуск не успел запустить следующий).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# Боту не нужно ничего коммитить в репозиторий — только читать секреты,
# ходить в Telegram/Gemini API и запускать сам себя дальше (actions: write
# нужен именно для самозапуска через API, contents: write не нужен).
permissions:
  contents: read
  actions: write

# Не даём двум запускам опрашивать Telegram одновременно (иначе Telegram
# ответит ошибкой конфликта getUpdates). Новый запуск отменяет застрявший
# предыдущий, чтобы очередь не копилась.
concurrency:
  group: telegram-gemini-bot
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        working-directory: telegram-gemini-bot
        run: pip install -r requirements.txt

      - name: Опросить Telegram и обработать сообщения
        working-directory: telegram-gemini-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POLL_SECONDS: "420"
        run: python poll_once.py
