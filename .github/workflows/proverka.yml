name: Проверка сайта

# Идёт на каждую отправку кода и на каждое предложение правки. Если что-то
# сломано, у коммита на GitHub появляется красный крестик, а в нём — список
# по-русски: что именно и где чинить. Сайт при этом всё равно публикуется
# (так устроены GitHub Pages), поэтому на крестик надо смотреть.

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  proverka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Проверить сайт
        run: node scripts/check-site.mjs
      - name: Проверить синтаксис служебных скриптов
        run: |
          node --check sw.js
          node --check scripts/check-site.mjs
          node --check scripts/fetch-telegram-posts.mjs
          node --check scripts/vendor-fonts.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Проверить код и тесты Telegram-бота
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('telegram-gemini-bot').glob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              print(f'Синтаксис корректен: {path}')
          PY
          python -m unittest discover -s telegram-gemini-bot -p 'test_*.py'
